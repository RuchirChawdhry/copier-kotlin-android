_min_copier_version: "9.19.1"
_subdirectory: template
_templates_suffix: .jinja
project_name:
  type: str
  default: Android App
  validator: >-
    {% if not (project_name | regex_search('^[A-Za-z][A-Za-z0-9 _-]{0,63}$')) %}Use a name of 1–64 letters, digits, spaces, underscores or hyphens.{% endif %}
application_id:
  type: str
  default: com.example.androidapp
  validator: >-
    {% if not (application_id | regex_search('^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+$')) %}Use a lowercase reverse-domain application ID.{% endif %}
include_robolectric:
  type: bool
  default: false
  help: Include Android JVM simulation tests?
include_http:
  type: bool
  default: false
  help: Include an OkHttp client and Internet permission?
include_background_jobs:
  type: bool
  default: false
  help: Include WorkManager and a sample background job?
include_file_access:
  type: bool
  default: false
  help: Include a Storage Access Framework document picker?
include_notifications:
  type: bool
  default: false
  help: Include notification channel and runtime permission example?
