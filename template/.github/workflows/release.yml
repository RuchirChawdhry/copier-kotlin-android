name: Build release artifacts

# Opt-in. This workflow does not publish to Google Play or run as part of CI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - name: Prepare optional signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Package phone/tablet and optional watch
        shell: bash
        run: |
          targets=(:app:assembleRelease :app:bundleRelease)
          if [[ -d wear ]]; then
            targets+=(:wear:assembleRelease :wear:bundleRelease)
          fi
          ./gradlew "${targets[@]}" --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            wear/build/outputs/apk/release/*.apk
            wear/build/outputs/bundle/release/*.aab
          retention-days: 14
