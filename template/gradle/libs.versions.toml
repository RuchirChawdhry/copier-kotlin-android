[versions]
agp = "8.9.2"
kotlin = "2.1.20"
baselineprofile = "1.3.4"
ktlint = "12.1.2"
detekt = "1.23.8"
compose = "2025.04.01"
activity = "1.10.1"
datastore = "1.1.4"
profileinstaller = "1.4.1"
junit = "4.13.2"
robolectric = "4.14.1"
test-core = "1.6.1"
test-junit = "1.2.1"
test-runner = "1.6.2"
uiautomator = "2.3.0"
benchmark = "1.3.4"
okhttp = "4.12.0"
work = "2.10.1"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-icons = { module = "androidx.compose.material:material-icons-core" }
compose-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
android-test-core = { module = "androidx.test:core", version.ref = "test-core" }
android-test-junit = { module = "androidx.test.ext:junit", version.ref = "test-junit" }
android-test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
macrobenchmark = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
work = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofile" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
