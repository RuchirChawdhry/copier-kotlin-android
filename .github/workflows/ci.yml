name: Android CI
on:
  push:
    paths-ignore:
      - 'wiki/**'
      - 'screenshots/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    uses: RuchirChawdhry/ci-workflows/.github/workflows/kotlin-android.yml@main
    with:
      template: true
