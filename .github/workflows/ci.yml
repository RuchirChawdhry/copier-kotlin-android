name: Android CI
on:
  push:
    paths-ignore:
      - 'wiki/**'
      - 'screenshots/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  copier-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Generate minimal, default, and optional-capability projects
        run: python3 tests/test_generation.py
  optional-pack-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: astral-sh/setup-uv@v6
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate all optional capability and UI profiles
        run: uvx --from copier==9.19.1 copier copy --defaults --data-file tests/optional-profile.yml --vcs-ref=HEAD . optional
      - name: Install project SDK
        working-directory: optional
        run: bash scripts/sdk.sh install
      - name: Compile and lint selected integrations
        working-directory: optional
        run: ./gradlew :app:ktlintCheck :app:assembleDebug :wear:assembleDebug --continue --stacktrace
  checks:
    uses: RuchirChawdhry/ci-workflows/.github/workflows/kotlin-android.yml@main
    with:
      template: true
