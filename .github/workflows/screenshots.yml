name: Android UI screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/screenshots.yml'
      - 'template/scripts/screenshots.sh.jinja'
      - 'template/scripts/validate-screenshots.py'
      - 'template/scripts/screenshot-scenarios.json'
      - 'template/app/src/androidTest/**'
      - 'template/app/src/main/**'
      - 'template/app/build.gradle.kts.jinja'
permissions:
  contents: read
concurrency:
  group: android-screenshots-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    uses: RuchirChawdhry/ci-workflows/.github/workflows/kotlin-android.yml@main
    with:
      template: true
      mode: screenshots
  publish:
    needs: capture
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: android-ui-screenshots
          path: capture
      - name: Validate and replace screenshot set
        run: |
          python3 template/scripts/validate-screenshots.py capture
          # Do not publish captures made against changed application sources.
          if ! git diff --quiet "$GITHUB_SHA" HEAD -- template copier.yml .github/workflows/screenshots.yml; then
            echo '::error::Application sources changed during capture; regenerate screenshots.'
            exit 1
          fi
          rm -rf screenshots
          mv capture screenshots
          git add -A -- screenshots
          if git diff --cached --quiet; then
            echo 'Screenshots have not changed.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'docs: refresh Android UI screenshots'
          git push origin "HEAD:$GITHUB_REF"
